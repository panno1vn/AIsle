<svg width="1080" height="380" viewBox="0 0 1080 380" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/>
    </marker>
  </defs>

  <rect width="1080" height="380" fill="#FFFFFF"/>
  <text x="20" y="26" font-size="16" font-weight="700" fill="#111827">AIsle — Information Architecture</text>
  <text x="20" y="44" font-size="11" fill="#6B7280">Cấu trúc 5 màn hình dashboard cho Manager — điều hướng tự do qua sidebar, không bắt buộc tuyến tính</text>

  <!-- 5 màn hình -->
  <!-- Màn 1 -->
  <rect x="20" y="70" width="190" height="95" rx="10" fill="#E8F4FB" stroke="#2094B8" stroke-width="1.5"/>
  <circle cx="196" cy="84" r="6" fill="#22C55E"/>
  <text x="115" y="100" font-size="12.5" font-weight="700" fill="#0B3B4D" text-anchor="middle">1. Layout Designer</text>
  <text x="115" y="118" font-size="10" fill="#0B3B4D" text-anchor="middle">Vẽ zone polygon</text>
  <text x="115" y="132" font-size="10" fill="#0B3B4D" text-anchor="middle">tự do, đặt tên zone</text>
  <text x="115" y="150" font-size="9" fill="#16A34A" text-anchor="middle" font-weight="700">✓ đã có UI</text>

  <!-- Màn 2 -->
  <rect x="240" y="70" width="190" height="95" rx="10" fill="#E8F4FB" stroke="#2094B8" stroke-width="1.5"/>
  <circle cx="416" cy="84" r="6" fill="#9CA3AF"/>
  <text x="335" y="100" font-size="12.5" font-weight="700" fill="#0B3B4D" text-anchor="middle">2. Catalog Manager</text>
  <text x="335" y="118" font-size="10" fill="#0B3B4D" text-anchor="middle">Nhập/import sản</text>
  <text x="335" y="132" font-size="10" fill="#0B3B4D" text-anchor="middle">phẩm (form / CSV)</text>
  <text x="335" y="150" font-size="9" fill="#6B7280" text-anchor="middle">đang xây</text>

  <!-- Màn 3 -->
  <rect x="460" y="70" width="190" height="95" rx="10" fill="#E8F4FB" stroke="#2094B8" stroke-width="1.5"/>
  <circle cx="636" cy="84" r="6" fill="#9CA3AF"/>
  <text x="555" y="100" font-size="12.5" font-weight="700" fill="#0B3B4D" text-anchor="middle">3. Cấu hình &amp; Chạy</text>
  <text x="555" y="118" font-size="10" fill="#0B3B4D" text-anchor="middle">Chọn λ(t), số NPC,</text>
  <text x="555" y="132" font-size="10" fill="#0B3B4D" text-anchor="middle">bấm chạy mô phỏng</text>
  <text x="555" y="150" font-size="9" fill="#6B7280" text-anchor="middle">đang xây</text>

  <!-- Màn 4 -->
  <rect x="680" y="70" width="190" height="95" rx="10" fill="#E8F4FB" stroke="#2094B8" stroke-width="1.5"/>
  <circle cx="856" cy="84" r="6" fill="#22C55E"/>
  <text x="775" y="100" font-size="12.5" font-weight="700" fill="#0B3B4D" text-anchor="middle">4. Kết quả &amp; Replay</text>
  <text x="775" y="118" font-size="10" fill="#0B3B4D" text-anchor="middle">Số liệu, biểu đồ,</text>
  <text x="775" y="132" font-size="10" fill="#0B3B4D" text-anchor="middle">replay NPC di chuyển</text>
  <text x="775" y="150" font-size="9" fill="#16A34A" text-anchor="middle" font-weight="700">✓ đã có UI</text>

  <!-- Màn 5 -->
  <rect x="900" y="70" width="160" height="95" rx="10" fill="#E8F4FB" stroke="#2094B8" stroke-width="1.5"/>
  <circle cx="1046" cy="84" r="6" fill="#9CA3AF"/>
  <text x="980" y="100" font-size="12.5" font-weight="700" fill="#0B3B4D" text-anchor="middle">5. Lịch sử</text>
  <text x="980" y="118" font-size="10" fill="#0B3B4D" text-anchor="middle">So sánh nhiều</text>
  <text x="980" y="132" font-size="10" fill="#0B3B4D" text-anchor="middle">lần chạy trước</text>
  <text x="980" y="150" font-size="9" fill="#6B7280" text-anchor="middle">đang xây</text>

  <!-- Mũi tên nối tiếp 1->2->3->4->5 -->
  <line x1="210" y1="117" x2="238" y2="117" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="430" y1="117" x2="458" y2="117" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="650" y1="117" x2="678" y2="117" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="870" y1="117" x2="898" y2="117" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- Mũi tên quay lại: từ Màn 5 vòng xuống về Màn 1 -->
  <path d="M 980,166 L 980,215 L 115,215 L 115,167" fill="none" stroke="#4A5568" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow2)"/>
  <text x="547" y="208" font-size="10.5" fill="#374151" text-anchor="middle">Manager quay lại sửa layout/catalog bất kỳ lúc nào (điều hướng tự do qua sidebar)</text>

  <!-- Dữ liệu dùng chung -->
  <rect x="20" y="250" width="1040" height="90" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="40" y="276" font-size="13" font-weight="700" fill="#1F2937">Dữ liệu dùng chung</text>
  <text x="40" y="298" font-size="10.5" fill="#374151">layout.json (zones + catalog + spawn_rate_curve)  ·  genome (quần thể NPC, ~150-200)  ·  purchase_log  ·  trajectory_log</text>
  <text x="40" y="316" font-size="9.5" fill="#6B7280">Cả 5 màn đọc/ghi chung một bộ dữ liệu này — đây là "hợp đồng dữ liệu" giữa các thành phần, không phải state riêng của từng màn.</text>

  <!-- chú thích trạng thái -->
  <circle cx="30" cy="358" r="6" fill="#22C55E"/>
  <text x="42" y="362" font-size="10" fill="#374151">Đã có UI chạy được</text>
  <circle cx="180" cy="358" r="6" fill="#9CA3AF"/>
  <text x="192" y="362" font-size="10" fill="#374151">Đang xây (Tuần 2-3)</text>
</svg>
