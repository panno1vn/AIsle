<svg width="900" height="460" viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B8860B"/>
    </marker>
  </defs>

  <rect width="900" height="460" fill="#FFFFFF"/>
  <text x="20" y="26" font-size="16" font-weight="700" fill="#111827">AIsle — Information System Diagram</text>
  <text x="20" y="44" font-size="11" fill="#6B7280">Sơ đồ hệ thống cấp cao: actor, thành phần, luồng dữ liệu</text>

  <!-- ===== Hàng chính: Manager - Dashboard - Simulation Engine - Data Store ===== -->

  <!-- Manager (actor) -->
  <rect x="20" y="90" width="150" height="80" rx="10" fill="#F3F4F6" stroke="#4B5563" stroke-width="1.5"/>
  <text x="95" y="122" font-size="13" font-weight="700" fill="#1F2937" text-anchor="middle">Manager</text>
  <text x="95" y="140" font-size="10.5" fill="#4B5563" text-anchor="middle">(Chủ / quản lý</text>
  <text x="95" y="153" font-size="10.5" fill="#4B5563" text-anchor="middle">cửa hàng)</text>

  <!-- Dashboard -->
  <rect x="230" y="90" width="170" height="80" rx="10" fill="#E8F4FB" stroke="#2094B8" stroke-width="1.5"/>
  <text x="315" y="122" font-size="13" font-weight="700" fill="#0B3B4D" text-anchor="middle">Dashboard / UI</text>
  <text x="315" y="140" font-size="10.5" fill="#0B3B4D" text-anchor="middle">(Streamlit,</text>
  <text x="315" y="153" font-size="10.5" fill="#0B3B4D" text-anchor="middle">5 màn hình)</text>

  <!-- Simulation Engine -->
  <rect x="460" y="90" width="170" height="80" rx="10" fill="#E8F4FB" stroke="#2094B8" stroke-width="1.5"/>
  <text x="545" y="122" font-size="13" font-weight="700" fill="#0B3B4D" text-anchor="middle">Simulation Engine</text>
  <text x="545" y="140" font-size="10.5" fill="#0B3B4D" text-anchor="middle">(engine/, vòng lặp tick,</text>
  <text x="545" y="153" font-size="10.5" fill="#0B3B4D" text-anchor="middle">utility, emotion, mua hàng)</text>

  <!-- Data Store -->
  <rect x="690" y="90" width="170" height="80" rx="10" fill="#E8F4FB" stroke="#2094B8" stroke-width="1.5"/>
  <text x="775" y="122" font-size="13" font-weight="700" fill="#0B3B4D" text-anchor="middle">Data Store</text>
  <text x="775" y="140" font-size="10.5" fill="#0B3B4D" text-anchor="middle">(layout/catalog.json,</text>
  <text x="775" y="153" font-size="10.5" fill="#0B3B4D" text-anchor="middle">purchase/trajectory log)</text>

  <!-- Arrows hàng chính (đi) -->
  <line x1="170" y1="112" x2="228" y2="112" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="199" y="102" font-size="9.5" fill="#374151" text-anchor="middle">vẽ layout,</text>
  <text x="199" y="112" font-size="9.5" fill="#374151" text-anchor="middle" dy="4">nhập catalog</text>

  <line x1="400" y1="112" x2="458" y2="112" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="429" y="102" font-size="9.5" fill="#374151" text-anchor="middle">layout.json +</text>
  <text x="429" y="112" font-size="9.5" fill="#374151" text-anchor="middle" dy="4">catalog.json</text>

  <line x1="630" y1="112" x2="688" y2="112" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="659" y="102" font-size="9.5" fill="#374151" text-anchor="middle">purchase_log +</text>
  <text x="659" y="112" font-size="9.5" fill="#374151" text-anchor="middle" dy="4">trajectory_log</text>

  <!-- Arrow phản hồi: Data Store -> Dashboard (đường vòng dưới, vào cạnh phải đáy Dashboard) -->
  <path d="M 740,170 L 740,230 L 350,230 L 350,172" fill="none" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="562" y="222" font-size="10" fill="#374151" text-anchor="middle">đọc dữ liệu để hiển thị số liệu, biểu đồ, replay</text>

  <!-- Arrow phản hồi: Dashboard -> Manager (đường vòng dưới, ra từ cạnh trái đáy Dashboard) -->
  <path d="M 280,172 L 280,255 L 95,255 L 95,172" fill="none" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="187" y="270" font-size="10" fill="#374151" text-anchor="middle">Doanh thu, biểu đồ, replay</text>

  <!-- ===== Hàng dưới: NPC Population Generator + Đối tác Camera/Video ===== -->

  <rect x="460" y="330" width="170" height="80" rx="10" fill="#E8F4FB" stroke="#2094B8" stroke-width="1.5"/>
  <text x="545" y="362" font-size="13" font-weight="700" fill="#0B3B4D" text-anchor="middle">NPC Population</text>
  <text x="545" y="378" font-size="13" font-weight="700" fill="#0B3B4D" text-anchor="middle">Generator</text>
  <text x="545" y="396" font-size="10.5" fill="#0B3B4D" text-anchor="middle">(population/, crossover + mutation)</text>

  <line x1="545" y1="328" x2="545" y2="172" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="595" y="250" font-size="9.5" fill="#374151" text-anchor="middle">quần thể</text>
  <text x="595" y="262" font-size="9.5" fill="#374151" text-anchor="middle">NPC (~200)</text>

  <!-- Đối tác Camera/Video - external, dashed -->
  <rect x="690" y="330" width="170" height="80" rx="10" fill="#FFF8E8" stroke="#B8860B" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="775" y="358" font-size="12" font-weight="700" fill="#6B4A0A" text-anchor="middle">Đối tác</text>
  <text x="775" y="374" font-size="12" font-weight="700" fill="#6B4A0A" text-anchor="middle">Camera / Video</text>
  <text x="775" y="392" font-size="9.5" fill="#6B4A0A" text-anchor="middle">(nguồn dữ liệu ngoài — do đối tác lo)</text>

  <line x1="810" y1="328" x2="810" y2="172" stroke="#B8860B" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowAmber)"/>
  <text x="855" y="250" font-size="9.5" fill="#6B4A0A" text-anchor="middle">emotion JSON</text>
  <text x="855" y="262" font-size="9.5" fill="#6B4A0A" text-anchor="middle">(tuỳ chọn —</text>
  <text x="855" y="274" font-size="9.5" fill="#6B4A0A" text-anchor="middle">Giai đoạn 2)</text>

  <!-- Legend -->
  <rect x="20" y="420" width="16" height="16" rx="3" fill="#E8F4FB" stroke="#2094B8"/>
  <text x="42" y="432" font-size="10.5" fill="#374151">Thành phần lõi (bắt buộc, PoC 5 tuần)</text>

  <rect x="330" y="420" width="16" height="16" rx="3" fill="#FFF8E8" stroke="#B8860B" stroke-dasharray="4,3"/>
  <text x="352" y="432" font-size="10.5" fill="#374151">Nguồn ngoài / tuỳ chọn — không nằm trên đường găng của PoC</text>
</svg>
